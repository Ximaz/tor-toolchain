x-tor-build: &tor-build
  context: .
  dockerfile: ./Dockerfile
  args:
    TOR_VERSION: 0.4.9.9

services:
  tor-toolchain:
    image: tor-toolchain:latest
    container_name: tor-toolchain
    build: *tor-build

  tor-proxy:
    image: tor-toolchain:latest
    container_name: tor-proxy
    build: *tor-build
    volumes:
      - ./torrc:/torrc:ro
    entrypoint: ["tor", "-f", "/torrc"]
    ports:
      - "127.0.0.1:9050:9050"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /var/lib/tor:uid=1000,gid=1000,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M
