services:
  tor-toolchain:
    image: tor-toolchain:latest
    container_name: tor-toolchain
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - TOR_VERSION=0.4.9.9

  tor-proxy:
    image: tor-toolchain:latest
    container_name: tor-proxy
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - TOR_VERSION=0.4.9.9
    volumes:
      - ./torrc:/torrc:ro
    entrypoint: ["tor", "-f", "/torrc"]
    ports:
      - "127.0.0.1:9050:9050"
